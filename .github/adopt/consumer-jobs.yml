name: WF adopt

# 本檔＝`snapshot --adopt install` 的框架資產 `consumer-ci-jobs` 的**來源檔**（`core/adopt.md` §2
# 框架資產表）。install 只做**整檔**落地：目標路徑 .github/workflows/wf.yml 上⛔ 無既有物時整檔寫過去，
# 已有既有物時對該路徑零位元組寫入、只輸出一項未完成項，併入既有 workflow 是執行者 AI 的工作。
# 它在本 repo ⛔ 不住 .github/workflows/：本 repo 自己的 CI 在 .github/workflows/ci.yml。
# 自 `jobs:` 之後的全部位元組逐字抄自 ci.yml，允許的差異恰一處＝checkout 的 `with:` 多兩行
# submodules: true（rules source 以 submodule 掛載時 runner 才取得到 rules root）。含兩個 job 之間
# 那一行空行：比對的母體是兩個整檔、⛔ 不經任何片段解析器，少一個位元組就對不上。
# 同步是測試義務，見 cli/tests/test_adopt_assets.py。⛔ 不得推出「可以在此改動 job 內容」——改了測試會紅。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    # P4：secrets 不進 git。gitleaks 掃 PR 範圍（pull_request）或 push 範圍的 commit。
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-trailer:
    # P5：commit trailer 鍵在允許集合內，且是訊息末端的連續單一區塊。
    # 只驗「鍵」與「連續」（core/platform.md P5）；哪些 trailer 必須出現＝約定，住 roles/conduct-common.md §2，CI 不驗。
    name: commit-trailer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: 決定受檢 commit 範圍
        id: range
        run: |
          # PR：合併結果對 base 的新 commit。分支 push：對 main 的新 commit。
          # main push：本次推上來的區間（首推或 before 不可得時退回最後 1 個）。
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=origin/${{ github.base_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "range=origin/main..HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: 驗 trailer 鍵與連續區塊
        run: python3 .github/scripts/trailer_check.py "${{ steps.range.outputs.range }}"
