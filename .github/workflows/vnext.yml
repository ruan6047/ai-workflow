name: vNext CI

# vNext 重構期的獨立工程檢查。被測物＝vnext/cli/tests。
# 隔離對稱：本檔 branches 的 codex/vnext- 前綴 pattern，與 ci.yml 中
# commit-trailer／reachability／cli-tests 三個舊 job 的 `if:` 使用同一個前綴。
# ⛔ 無行數門檻、⛔ 無禁字掃描、⛔ 無散文判讀；⛔ 初期不列 main required checks。

on:
  push:
    branches:
      - 'codex/vnext-**'
  pull_request:
    branches:
      - 'codex/vnext-rebuild'

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: vnext-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vnext-tests:
    name: vnext-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: 記錄 event 與 ref 的實際值（W1.1 證據）
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "head_ref=${{ github.head_ref }}"
          echo "base_ref=${{ github.base_ref }}"
          echo "sha=${{ github.sha }}"
      - run: python -m pip install pytest
      - run: python -m pytest vnext/cli/tests -q
