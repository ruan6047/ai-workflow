name: CI

# 本檔＝執行 artifact；兩個守門的依據居所＝vnext/.wf/repo-guards.md。
# job → 被測物（穩定對應）：
#   secret-scan    ＝ 機密不進 git（gitleaks）
#   commit-trailer ＝ commit trailer 鍵與連續區塊（.github/scripts/trailer_check.py）
# vNext 的測試 job（vnext-tests）住 .github/workflows/vnext.yml。
# ⛔ 不加沒有被測物的 job。
#
# Python 版本：本檔有 Python 消費點的 job（commit-trailer）恰有一個 `actions/setup-python`，
# `python-version` 逐字是 "3.14"，與 vnext/cli/pyproject.toml 的 requires-python 同一個版本契約；
# 沒釘的 job 會跑到 runner 內建的未釘選 `python3`。⛔ 無以 Python 版本為維度的 `strategy.matrix`。
#
# 上面是本檔有哪些 job，⛔ 不是「哪些 job 被設為 required check」的宣稱。
# 後者是會漂移的當下值，⛔ 不登記在本檔，用 vnext/.wf/repo-guards.md 列的唯讀查法現查。

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secret-scan:
    # 機密不進 git（vnext/.wf/repo-guards.md §1）。gitleaks 掃 PR 範圍（pull_request）或 push 範圍的 commit。
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-trailer:
    # commit trailer 鍵在允許集合內，且是訊息末端的連續單一區塊。
    # 只驗「鍵」與「連續」（vnext/.wf/repo-guards.md §2）；哪些 trailer 必須出現 CI 不驗。
    name: commit-trailer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: 決定受檢 commit 範圍
        id: range
        run: |
          # PR：合併結果對 base 的新 commit。分支 push：對 main 的新 commit。
          # main push：本次推上來的區間（首推或 before 不可得時退回最後 1 個）。
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=origin/${{ github.base_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "range=origin/main..HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: 驗 trailer 鍵與連續區塊
        run: python3 .github/scripts/trailer_check.py "${{ steps.range.outputs.range }}"
