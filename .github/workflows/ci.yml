name: CI

# 第三輪重構第 0 步（骨架 §十三；需求方 2026-09-04 裁定封存為第一步）。
# 本步只留兩個有被測物的 job：secret-scan（P4）、commit-trailer（P5）。
# 轉移表可達性 job 隨第 1 步 core/state-machine.md 進場；新 CLI 測試 job 隨第 6 步進場。
# ⛔ 不再有掃描 docs 的 job。
#
# `tests` 與 `doctor-pure` 兩個匯總 job 只因 ruleset「main must be green」（id 20768920）
# 綁的 required check 名字是這兩個；第 7 步改 ruleset 後拿掉。
# P1–P5 的條文居所＝core/platform.md（第 1 步）；本檔只是執行 artifact。

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secret-scan:
    # P4：secrets 不進 git。gitleaks 掃 PR 範圍（pull_request）或 push 範圍的 commit。
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-trailer:
    # P5：commit trailer 鍵在允許集合內，且是訊息末端的連續單一區塊。
    # 本步只驗「鍵」與「連續」；哪些 trailer 必須出現，等 core/platform.md 條文（第 1 步）。
    name: commit-trailer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 決定受檢 commit 範圍
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=origin/${{ github.base_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "range=HEAD~20..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: 驗 trailer 鍵與連續區塊
        run: python3 .github/scripts/trailer_check.py "${{ steps.range.outputs.range }}"

  tests:
    # 匯總 job；名字＝ruleset required check。第 7 步改 ruleset 後刪除。
    name: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && 'tests' || 'tests (branch head)' }}
    needs: [secret-scan, commit-trailer]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "secret-scan 與 commit-trailer 皆綠"

  doctor-pure:
    # 匯總 job；名字＝ruleset required check。第 7 步改 ruleset 後刪除。
    name: doctor-pure
    needs: [secret-scan, commit-trailer]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "placeholder for ruleset required check; removed at step 7"
