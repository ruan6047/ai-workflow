name: CI

# 第三輪重構第 0 步（骨架 §十三；需求方 2026-09-04 裁定封存為第一步）。
# 第 0 步：secret-scan（P4）、commit-trailer（P5）。第 1 步加 reachability（core/state-machine.md）。
# 新 CLI 測試 job 隨第 6 步進場。
# ⛔ 不再有掃描 docs 的 job。
#
# ruleset「main must be green」（id 20768920）的 required check＝secret-scan、commit-trailer、reachability
#（需求方 2026-09-05 裁定：第 0 步改 ruleset 不留空 job；第 1 步加 reachability）。
# P1–P5 的條文居所＝core/platform.md（第 1 步）；本檔只是執行 artifact。

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secret-scan:
    # P4：secrets 不進 git。gitleaks 掃 PR 範圍（pull_request）或 push 範圍的 commit。
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-trailer:
    # P5：commit trailer 鍵在允許集合內，且是訊息末端的連續單一區塊。
    # 只驗「鍵」與「連續」（core/platform.md P5）；哪些 trailer 必須出現＝約定，住 roles/conduct-common.md §2，CI 不驗。
    name: commit-trailer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 決定受檢 commit 範圍
        id: range
        run: |
          # PR：合併結果對 base 的新 commit。分支 push：對 main 的新 commit。
          # main push：本次推上來的區間（首推或 before 不可得時退回最後 1 個）。
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=origin/${{ github.base_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "range=origin/main..HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: 驗 trailer 鍵與連續區塊
        run: python3 .github/scripts/trailer_check.py "${{ steps.range.outputs.range }}"

  reachability:
    # 骨架 §四：轉移表可達性。被測物＝core/state-machine.md 的 json wf-state-machine 區塊。
    name: reachability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/reachability.py --selftest
      - run: python3 .github/scripts/reachability.py
