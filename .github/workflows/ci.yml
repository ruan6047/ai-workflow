name: CI

# 本檔的裁定理由、擋得住／擋不住什麼、以及尚未機械化的部分，見
# docs/DEV_AIWF_MINIMAL_CI1.md。改觸發事件或移除步驟前先讀該檔。

on:
  # 無分支過濾：
  #   - push 到任一分支 → 測「分支頭」，給執行者自己的回饋。**非 main 分支的
  #                       push run 會被改名為 tests (branch head)**（見下方 job name），
  #                       所以它永遠不是 required check，只是參考。
  #   - pull_request    → GitHub 取出的是 refs/pull/N/merge，也就是**合併結果**，
  #                       不是分支頭。2026-08-12 的事故正是「分支頭綠、合併結果紅」，
  #                       只有這一支看得到。兩者互補，故刻意都留。
  push:
  pull_request:

# 刻意不加 paths / paths-ignore：一旦本 workflow 被設為 required status check，
# 被 path filter 跳過的 PR 會永遠停在 pending 而無法合併。省下的幾十秒
# 不值得換這個陷阱。
permissions:
  contents: read

# ⚠️ locale 顯式宣告，不繼承 runner image 的預設。裁定與理由見
# docs/DEV_AIWF_MINIMAL_CI1.md §10。三句話版本：
#   1. 本 repo 的文件、卡面、腳本訊息大量使用中文與全形標點，而 bash 在 UTF-8 與在 C
#      locale 下對「$var 緊接多位元組字元」的變數名掃描行為不同——2026-08-12 的 #42
#      對帳器就是只在 UTF-8 下炸、在 C 下 PASS。
#   2. runner image 的預設 locale 是 image 的實作細節，可能無聲改變；不宣告就等於把
#      判定基準託付給一個沒人在版控裡看得到的值。
#   3. 選 UTF-8 而不是 C：CI 該是比較嚴的那一邊。釘 C 會讓 CI 與某一台本機一致，
#      卻對所有其他環境失明——那是把偵測器調成永遠不會響。
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  # event_name 進 group：同一分支的 push run 與 pull_request run 測的是不同的樹
  # （分支頭 vs 合併結果），不可互相取消。
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # main 上的 run 是事後偵測的唯一訊號，不取消；其餘分支可取消以省額度。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    # ⚠️ 這個 name 就是 check 的名字，也就是 required status check 要比對的字串。
    # 一旦需求方把它設為 required（見 docs/DEV_AIWF_MINIMAL_CI1.md §7），
    # **改名或拆成多個 job 會讓所有 PR 永遠停在 pending**。改名前先改 ruleset。
    #
    # 為什麼要用表達式而不是固定字串：同一個 head SHA 會同時收到「分支頭 push run」
    # 與「PR merge ref run」兩個 check。若兩者同名，同一個 SHA 上就會出現兩個同名
    # 但結論相反的 check（實測：run 31592201889 success 與 31592230166 failure 都
    # 叫 tests、都掛在 f36c00e 上，完成時間相差 27 秒）。同名時哪一個算數是平台
    # 內部行為，而兩者完成順序只差幾十秒、實質是擲硬幣——閘門不能建在擲硬幣上。
    # 這裡直接讓它不可能發生：**required 的名字只由「合併結果」與 main 產生**，
    # 分支頭那一支改叫別的名字，永遠只是參考。判定見 docs/DEV_AIWF_MINIMAL_CI1.md §1.4。
    name: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && 'tests' || 'tests (branch head)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        # v7.0.1；釘 commit SHA 而非 tag：tag 可被重指。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # 本 job 不需要任何寫入權；不留憑證在 runner 上。
          persist-credentials: false

      - name: 標示實際受測的樹與 locale
        # 讓 log 自證「這一 run 測的到底是哪棵樹」。PR 事件下這裡印出的 SHA
        # 會是 merge commit，不是分支頭——這正是本 CI 的重點。
        #
        # locale 一併印出來的理由：它是判定基準的一部分（見上方 env 與
        # docs/DEV_AIWF_MINIMAL_CI1.md §10）。上面那三行是「我要求什麼」，
        # 這裡印的是「實際生效的是什麼」——兩者不一致時要看得見，
        # 例如 runner image 缺少 C.UTF-8 而 glibc 靜默退回 POSIX。
        run: |
          echo "event          = ${{ github.event_name }}"
          echo "checked-out    = $(git rev-parse HEAD)"
          echo "cli/ tree      = $(git rev-parse HEAD:cli)"
          git log -1 --format='subject        = %s'
          echo "--- locale ---"
          # 生效值；不是本 workflow 宣告的值。
          locale
          echo "--- runner image 的預設（不受本 workflow env 影響）---"
          # env -u 清掉本 workflow 注入的兩個變數，看 image 自己是什麼。
          # 純觀測，不影響任何判定。
          env -u LANG -u LC_ALL locale 2>&1 || true

      - name: setup uv
        # v9.0.0，同樣釘 SHA。
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          # 釘死 uv 與 Python：本 repo 沒有 .python-version，本機的 3.12 是
          # uv 當下的偶然解析結果。CI 若不釘，兩邊會無聲分歧。
          version: "0.11.19"
          python-version: "3.12"
          working-directory: cli
          enable-cache: true

      - name: 鎖檔未過期
        working-directory: cli
        run: uv lock --check

      - name: pytest
        working-directory: cli
        # --frozen：完全照 uv.lock 裝，不在 CI 裡重解相依。
        run: uv run --frozen pytest -q

      - name: escalation replay
        # cli/pyproject.toml 的 testpaths = ["tests"] 讓 pytest 永遠看不到這支腳本，
        # 它至今沒有任何自動執行者。純標準庫、不連網、不讀檔、0.9 秒，退出碼即判定。
        # 裁定理由見 docs/DEV_AIWF_MINIMAL_CI1.md §1.3。
        #
        # !cancelled() 而非 always()：pytest 紅了仍要跑完這支（兩個訊號一次拿到），
        # 但使用者按取消時不要多跑。**這不是 continue-on-error**——本步驟失敗
        # 一樣讓整個 job 判紅。
        if: ${{ !cancelled() }}
        # 用 uv 釘住的直譯器，不用 runner 的預設 python3（那個沒有釘）。
        run: uv run --no-project --python 3.12 scripts/replay_escalation_rules.py
