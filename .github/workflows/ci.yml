name: CI

# 本檔＝執行 artifact；P1–P5 的條文居所＝core/platform.md。
# job → 被測物（穩定對應）：
#   secret-scan    ＝ P4
#   commit-trailer ＝ P5（.github/scripts/trailer_check.py）
#   reachability   ＝ core/state-machine.md §5（.github/scripts/reachability.py）
#   cli-tests      ＝ CLI 的測試目錄 cli/tests（被測物＝cli/src），並印行數治理軟警示（.github/scripts/source_budget.py，rc 恆 0）
# ⛔ 不再有掃描 docs 的 job；⛔ 不加沒有被測物的 job。
#
# Python 版本：本檔每一個有 Python 消費點的 job（commit-trailer、reachability、cli-tests）
# 刻意各恰有一個 `actions/setup-python`，`python-version` 逐字都是 "3.14"。
# 為什麼：公開安裝條件（cli/pyproject.toml 的 requires-python）、正式 CI 與開發驗證
# 必須是同一個版本契約；沒釘的 job 會跑到 runner 內建的未釘選 `python3`。
# ⛔ 不得推出：框架仍承諾 3.11、3.12 或 3.13。初始支援集合只有 3.14，
# 因此本檔⛔ 無以 Python 版本為維度的 `strategy.matrix`。
#
# 上面是本檔有哪些 job，⛔ 不是「哪些 job 被設為 required check」的宣稱。
# 後者是會漂移的當下值，⛔ 不登記在本檔也⛔ 不登記在 core/platform.md，
# 用 core/platform.md §2 的唯讀查法現查。

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secret-scan:
    # P4：secrets 不進 git。gitleaks 掃 PR 範圍（pull_request）或 push 範圍的 commit。
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-trailer:
    # P5：commit trailer 鍵在允許集合內，且是訊息末端的連續單一區塊。
    # 只驗「鍵」與「連續」（core/platform.md P5）；哪些 trailer 必須出現＝約定，住 roles/conduct-common.md §2，CI 不驗。
    # vNext 隔離：分支名以 codex/vnext- 為前綴時本 job 不執行（skipped）。
    # push 看 github.ref_name；pull_request 的 ref_name 是 <number>/merge，
    # 所以另看 github.head_ref 與 github.base_ref。push event 下後兩者為空字串，
    # startsWith('', 'codex/vnext-') 為 false，不影響舊分支。
    if: ${{ !startsWith(github.ref_name, 'codex/vnext-') && !startsWith(github.head_ref, 'codex/vnext-') && !startsWith(github.base_ref, 'codex/vnext-') }}
    name: commit-trailer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: 決定受檢 commit 範圍
        id: range
        run: |
          # PR：合併結果對 base 的新 commit。分支 push：對 main 的新 commit。
          # main push：本次推上來的區間（首推或 before 不可得時退回最後 1 個）。
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=origin/${{ github.base_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "range=origin/main..HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: 驗 trailer 鍵與連續區塊
        run: python3 .github/scripts/trailer_check.py "${{ steps.range.outputs.range }}"

  reachability:
    # core/state-machine.md §5：轉移表可達性。被測物＝該檔 json wf-state-machine 區塊＋core/enums.md 的值域。
    # vNext 隔離：分支名以 codex/vnext- 為前綴時本 job 不執行（skipped）。
    # push 看 github.ref_name；pull_request 的 ref_name 是 <number>/merge，
    # 所以另看 github.head_ref 與 github.base_ref。push event 下後兩者為空字串，
    # startsWith('', 'codex/vnext-') 為 false，不影響舊分支。
    if: ${{ !startsWith(github.ref_name, 'codex/vnext-') && !startsWith(github.head_ref, 'codex/vnext-') && !startsWith(github.base_ref, 'codex/vnext-') }}
    name: reachability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - run: python3 .github/scripts/reachability.py --selftest
      - run: python3 .github/scripts/reachability.py

  cli-tests:
    # 新 CLI 測試 job 隨被測物同 PR 進場。
    # fetch-depth: 0＝cli/tests/test_baseline_parity.py 要以 `git archive <基線 SHA> cli/src` 取出
    # 固定基線樹跑隔離子行程；淺 clone 取不到那顆物件時該測試逐字須失敗而不得 skip。
    # 寫法照抄同檔 secret-scan 與 commit-trailer 兩個 job 的 `with:` 區塊。
    # vNext 隔離：分支名以 codex/vnext- 為前綴時本 job 不執行（skipped）。
    # push 看 github.ref_name；pull_request 的 ref_name 是 <number>/merge，
    # 所以另看 github.head_ref 與 github.base_ref。push event 下後兩者為空字串，
    # startsWith('', 'codex/vnext-') 為 false，不影響舊分支。
    if: ${{ !startsWith(github.ref_name, 'codex/vnext-') && !startsWith(github.head_ref, 'codex/vnext-') && !startsWith(github.base_ref, 'codex/vnext-') }}
    name: cli-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e "cli[dev]"
      - run: python -m pytest cli/tests -q
      # 治理軟警示：被測物＝cli/src/wf，rc 恆 0，⛔ 不擋。放在既有 job 內（⛔ 不加新 job），
      # 讓警示出現在 Checks 註記而非只留在 pytest 的被吞 stdout。
      - name: CLI production source 行數治理軟警示
        run: python .github/scripts/source_budget.py
