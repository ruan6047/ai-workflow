# 待審清單收件表單（第三輪重構，骨架 §一）。
#
# 形狀＝一個 `json wf-intake` 區塊，四欄 source／observation／dedupe／repo。
# 新 CLI `wf open` 只讀該區塊（決策 1）；散文欄給人看。
# ⛔ 本表單不判內容：PM 只看四欄有沒有填；內容對不對是開卡之後的事。
name: 待審清單提案
description: 把一個問題或想要的功能交給 PM 進待審清單（⛔ 不是開卡；卡由 PM 以 wf open 從此 issue 建）
title: "[清單] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **這張 issue 是清單項，⛔ 不是卡。** 它不在板上、⛔ 不配卡ID。

        四欄缺任一項，PM 退回提案者補；⛔ PM 不代填。

  - type: textarea
    id: intake
    attributes:
      label: wf-intake
      description: |
        填下面四個鍵，保留 fenced 區塊原樣。source＝一個連結或逐字引文加來源；observation＝可觀測的現象，⛔ 不寫「應該改成」；dedupe＝搜過的關鍵字加命中的 issue 號，⛔ 不寫「已確認沒有重複」；repo＝這件事將來會改哪個 repo。
      value: |
        ```json wf-intake
        {
          "source": "",
          "observation": "",
          "dedupe": {"keywords": [], "hits": []},
          "repo": "ai-workflow"
        }
        ```
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 補充（給人看，CLI 不讀）
      description: 任何脈絡、截圖、想法。
    validations:
      required: false
